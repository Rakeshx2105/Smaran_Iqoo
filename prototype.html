<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0" />
<title>SMARAN — Cognitive Companion</title>
<style>
/* =========================================================
   SMARAN — plain HTML / CSS / JS prototype
   No frameworks, no build step, no network calls: everything
   needed to run is inside this one file (works fully offline).

   Palette inspired by Assam: gamusa red/white weave, muga silk
   gold, and tea-garden green. System fonts only (no font CDN).
   ========================================================= */
:root{
  --cream:#FAF6EC; --cream-2:#F1ECDC; --paper:#FFFFFF;
  --ink:#25301F; --ink-soft:#54614C; --ink-faint:#8B9484;

  --tea:#2F5233; --tea-deep:#1E3A22; --tea-pale:#E4ECDF; --tea-mist:#CBDAC7;
  --gamusa:#A63D2C; --gamusa-deep:#7E2C1F; --gamusa-soft:#F3DED6;
  --muga:#C0902E; --muga-soft:#F3E6C4;
  --flag:#B5482E; --flag-soft:#F4DED6;

  --radius-sm:10px; --radius-md:18px; --radius-lg:28px;
  --shadow-sm:0 2px 8px rgba(37,48,31,0.08);
  --shadow-md:0 10px 30px rgba(37,48,31,0.12);

  --font-display: Georgia, 'Palatino Linotype', 'Iowan Old Style', serif;
  --font-body: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

  --tap:64px; --gap:1rem;
}

html{ font-size:17px; }
html.large-text{ font-size:21px; }
html.simple-mode .secondary-info{ display:none !important; }
html.reduced-motion *{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
html.high-contrast{
  --cream:#FFFFFF; --cream-2:#FFFFFF; --paper:#FFFFFF;
  --ink:#000000; --ink-soft:#000000; --ink-faint:#333333;
  --tea:#0B4020; --tea-deep:#062D15; --tea-pale:#DDEFE1;
  --gamusa:#8A0000; --gamusa-deep:#650000; --gamusa-soft:#FFE1DC;
  --muga:#7A5200; --muga-soft:#FFEFC7;
}
html.high-contrast .card, html.high-contrast .btn{ border-width:2px !important; }

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ background:var(--cream); color:var(--ink); font-family:var(--font-body); min-height:100vh; -webkit-font-smoothing:antialiased; }
h1,h2,h3,.display{ font-family:var(--font-display); color:var(--tea-deep); margin:0; font-weight:700; }
p{ margin:0; }
button{ font-family:inherit; }
svg{ display:block; flex-shrink:0; }
a{ color:inherit; }
:focus-visible{ outline:3px solid var(--muga); outline-offset:3px; }

.screen{ min-height:100vh; display:flex; flex-direction:column; }
.container{ width:100%; max-width:880px; margin:0 auto; padding:0 1.25rem; box-sizing:border-box; }
.grow{ flex:1; }

.gamusa-strip{ height:12px; width:100%;
  background-image: repeating-linear-gradient(90deg, var(--gamusa) 0 4px, var(--paper) 4px 6px, var(--gamusa) 6px 10px, var(--paper) 10px 34px);
  opacity:0.9; }
.gamusa-strip.thin{ height:7px; }
.hills{ width:100%; height:110px; display:block; }

.topbar{ position:sticky; top:0; z-index:20; background:var(--cream); border-bottom:1px solid var(--tea-mist); }
.topbar-inner{ display:flex; align-items:center; justify-content:space-between; padding:0.85rem 1.25rem; max-width:880px; margin:0 auto; gap:0.75rem; }
.iconbtn{ display:inline-flex; align-items:center; justify-content:center; width:52px; height:52px; border-radius:16px;
  background:var(--paper); border:1.5px solid var(--tea-mist); color:var(--tea-deep); cursor:pointer; }
.iconbtn:hover{ background:var(--tea-pale); }
.badge{ display:inline-flex; align-items:center; gap:0.4rem; font-size:0.85rem; font-weight:700; padding:0.4rem 0.75rem;
  border-radius:999px; background:var(--tea-pale); color:var(--tea-deep); border:1px solid var(--tea-mist); white-space:nowrap; }
.badge.offline{ background:var(--gamusa-soft); color:var(--gamusa-deep); border-color:#e3c1b6; }
.badge.flag{ background:var(--flag-soft); color:var(--flag); border-color:#e6c3b8; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:0.6rem; min-height:var(--tap); padding:0.9rem 1.6rem;
  border-radius:var(--radius-md); font-family:var(--font-body); font-weight:700; font-size:1.08rem; border:2px solid transparent;
  cursor:pointer; text-align:center; line-height:1.25; }
.btn-primary{ background:var(--tea); color:var(--paper); }
.btn-primary:hover{ background:var(--tea-deep); }
.btn-accent{ background:var(--gamusa); color:var(--paper); }
.btn-accent:hover{ background:var(--gamusa-deep); }
.btn-outline{ background:var(--paper); color:var(--tea-deep); border-color:var(--tea-mist); }
.btn-outline:hover{ background:var(--tea-pale); }
.btn-ghost{ background:transparent; color:var(--tea-deep); }
.btn-block{ width:100%; }
.btn-lg{ min-height:80px; font-size:1.3rem; border-radius:var(--radius-lg); }
.btn[disabled]{ opacity:0.45; cursor:not-allowed; }

.card{ background:var(--paper); border:1.5px solid var(--tea-mist); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:1.4rem; }
.card-tap{ cursor:pointer; width:100%; text-align:left; border:1.5px solid var(--tea-mist); display:flex; align-items:center; gap:1.1rem; }
.card-tap:hover{ box-shadow:var(--shadow-md); border-color:var(--tea); }

.chip{ display:inline-flex; align-items:center; gap:0.5rem; padding:0.65rem 1.1rem; border-radius:999px; border:2px solid var(--tea-mist);
  background:var(--paper); font-weight:700; cursor:pointer; min-height:52px; }
.chip.selected{ background:var(--tea); color:var(--paper); border-color:var(--tea); }

.meter{ height:14px; border-radius:999px; background:var(--tea-pale); overflow:hidden; }
.meter > span{ display:block; height:100%; background:var(--tea); border-radius:999px; }
.meter.muga > span{ background:var(--muga); }

.stack{ display:flex; flex-direction:column; gap:var(--gap); }
.row{ display:flex; align-items:center; gap:var(--gap); }
.wrap{ flex-wrap:wrap; }
.center{ text-align:center; }
.muted{ color:var(--ink-soft); }
.faint{ color:var(--ink-faint); }
.between{ justify-content:space-between; }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
.grid-auto{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1.1rem; }
@media (max-width:640px){ .grid-2{ grid-template-columns:1fr; } }

.puzzle-piece{ border-radius:10px; border:2px solid var(--paper); cursor:pointer; background-repeat:no-repeat; aspect-ratio:1/1; }
.puzzle-piece.selected{ outline:4px solid var(--muga); outline-offset:-4px; }
.puzzle-piece.placed-correct{ outline:4px solid var(--tea); outline-offset:-4px; }

.fade-in{ animation:fadeIn .35s ease both; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.toggle{ width:58px; height:34px; border-radius:999px; position:relative; flex-shrink:0; cursor:pointer; background:var(--tea-mist); transition:background .2s; }
.toggle.on{ background:var(--tea); }
.toggle .knob{ position:absolute; top:3px; left:3px; width:28px; height:28px; border-radius:50%; background:var(--paper); transition:left .2s; box-shadow:var(--shadow-sm); }
.toggle.on .knob{ left:27px; }
.toggle-row{ display:flex; align-items:center; justify-content:space-between; width:100%; min-height:56px; }
.toggle-row .toggle-label{ font-weight:700; }

.hbar-row{ display:grid; grid-template-columns:120px 1fr 60px; align-items:center; gap:0.75rem; }
.hbar-track{ height:16px; border-radius:999px; background:var(--tea-pale); overflow:hidden; }
.hbar-fill{ height:100%; border-radius:999px; }

.sr-only{ position:absolute; width:1px;height:1px; overflow:hidden; clip:rect(0,0,0,0); }
</style>
</head>

/* =========================================================
   Adaptive difficulty — simple rule-based thresholds only,
   no machine learning: >85% harder, 60-85% same, <60% easier.
   ========================================================= */
function nextDifficulty(current, accuracyPct){
  const order = ["easy","medium","hard"];
  const idx = order.indexOf(current);
  if(accuracyPct > 85) return order[Math.min(idx+1, order.length-1)];
  if(accuracyPct < 60) return order[Math.max(idx-1, 0)];
  return current;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

function miniTrendChart(data){
  const w=280,h=90,max=100;
  const pts = data.map(function(v,i){ return [(i/(data.length-1))*w, h-(v/max)*h]; });
  let path = "";
  pts.forEach(function(p,i){ path += (i===0?"M":"L") + p[0].toFixed(1) + "," + p[1].toFixed(1) + " "; });
  let dots = "";
  pts.forEach(function(p,i){
    const last = i===pts.length-1;
    dots += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (last?5:3) + '" fill="' + (last?"var(--muga)":"var(--tea)") + '"/>';
  });
  const polyPts = pts.map(function(p){ return p.join(","); }).join(" ");
  return (
    '<svg viewBox="0 0 ' + w + " " + h + '" style="width:100%;height:100px">' +
      '<polyline points="' + polyPts + '" fill="none" stroke="var(--tea-mist)" stroke-width="10" stroke-linecap="round"/>' +
      '<path d="' + path + '" fill="none" stroke="var(--tea)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>' +
      dots +
    "</svg>"
  );
}

/* =========================================================
   GAME STATE SETUP — called whenever the route changes to a
   game screen, to (re)initialise that game's transient state.
   ========================================================= */
function setupGameState(gameId){
  const diff = S.difficulty[gameId];
  if(gameId === "jigsaw"){
    const gridSize = diff==="easy" ? 2 : diff==="medium" ? 3 : 4;
    const total = gridSize*gridSize;
    S.game = {id:"jigsaw", diff:diff, gridSize:gridSize, total:total,
      order: shuffle(Array.from({length: total}, function(_,i){ return i; })),
      selected: null, mistakes: 0, hints: 0, done: false, seconds: 0};
  } else if(gameId === "familiar"){
    S.game = {id:"familiar", diff:diff, cards: shuffle(FAMILIAR_CARDS), idx: 0, stage:"ask",
      correct: 0, mistakes: 0, done: false, seconds: 0};
  } else if(gameId === "audio"){
    const clipCount = diff==="easy" ? 2 : AUDIO_CLIPS.length;
    S.game = {id:"audio", diff:diff, clips: shuffle(AUDIO_CLIPS).slice(0, clipCount), idx: 0,
      played:false, correct:0, mistakes:0, done:false, seconds:0};
  } else if(gameId === "routine"){
    S.game = {id:"routine", diff:diff, pool: shuffle(ROUTINE_STEPS), chosen: [], mistakes: 0, done:false, seconds:0};
  } else {
    S.game = null;
  }
}

function finishGame(gameId, correct, total, mistakes, hints, seconds){
  const t = tFor(S.lang);
  const accuracy = Math.round((correct/total)*100);
  const usedDiff = S.difficulty[gameId];
  const nd = nextDifficulty(usedDiff, accuracy);
  S.difficulty = Object.assign({}, S.difficulty);
  S.difficulty[gameId] = nd;
  saveLS("smaran_difficulty", S.difficulty);
  const titleKeyMap = {jigsaw:"jigsawTitle", familiar:"familiarTitle", audio:"audioTitle", routine:"routineTitle"};
  S.lastResult = {
    gameId: gameId, gameTitle: t[titleKeyMap[gameId]],
    correct: correct, total: total, mistakes: mistakes, hints: hints,
    timeSeconds: seconds, difficulty: usedDiff, nextDifficulty: nd,
  };
  setTimeout(function(){ nav("/patient/results"); }, 700);
}

/* ---- GAME 1: Adaptive Jigsaw ---- */
function pageJigsaw(t){
  const g = S.game;
  const pieceSize = 480 / g.gridSize;
  let pieces = "";
  g.order.forEach(function(pieceId, posIndex){
    const px = (pieceId % g.gridSize) * pieceSize;
    const py = Math.floor(pieceId / g.gridSize) * pieceSize;
    const correct = pieceId === posIndex;
    const cls = "puzzle-piece" + (g.selected===posIndex?" selected":"") + (correct?" placed-correct":"");
    const bgPos = (px/(480-pieceSize))*100 + "% " + (py/(480-pieceSize))*100 + "%";
    pieces += '<div class="' + cls + '" data-action="jig-tap" data-pos="' + posIndex + '" style="' +
      'background-image:url(&quot;' + SCENE_URI + '&quot;);background-size:' + (g.gridSize*100) + "% " + (g.gridSize*100) + "%;" +
      "background-position:" + bgPos + ';"></div>';
  });
  return (
    '<div class="screen">' +
      topBar(t, t.jigsawTitle, {right:'<span class="badge secondary-info">' + t.difficulty + ": " + t[g.diff] + "</span>"}) +
      '<div class="grow container center" style="padding-top:1.5rem;padding-bottom:2rem">' +
        '<p class="muted" style="margin-bottom:1rem">' + t.tapToSwap + "</p>" +
        '<div style="display:grid;grid-template-columns:repeat(' + g.gridSize + ',1fr);gap:4px;width:min(92vw,420px);aspect-ratio:1/1;margin:0 auto;background:var(--tea-deep);padding:6px;border-radius:16px">' +
          pieces +
        "</div>" +
        '<div class="row" style="justify-content:center;gap:1rem;margin-top:1.5rem">' +
          '<span class="badge">' + icon("clock",16) + Math.floor(g.seconds/60) + ":" + String(g.seconds%60).padStart(2,"0") + "</span>" +
          '<span class="badge">' + icon("x",16) + t.mistakes + ": " + g.mistakes + "</span>" +
          '<button class="btn btn-outline" data-action="jig-hint" ' + (g.done?"disabled":"") + ">" + t.hints + "</button>" +
        "</div>" +
      "</div>" +
    "</div>"
  );
}
function jigTap(pos){
  const g = S.game;
  if(g.done) return;
  if(g.selected === null){ g.selected = pos; render(); return; }
  if(g.selected === pos){ g.selected = null; render(); return; }
  const tmp = g.order[g.selected]; g.order[g.selected] = g.order[pos]; g.order[pos] = tmp;
  const madeMistake = g.order[pos]!==pos && g.order[g.selected]!==g.selected;
  if(madeMistake) g.mistakes++;
  g.selected = null;
  if(g.order.every(function(v,i){ return v===i; })){
    g.done = true;
    finishGame("jigsaw", g.total - Math.min(g.mistakes, g.total), g.total, g.mistakes, g.hints, g.seconds);
  }
  render();
}
function jigHint(){
  const g = S.game;
  if(g.done) return;
  g.hints++;
  const wrongPos = g.order.findIndex(function(v,i){ return v!==i; });
  if(wrongPos===-1){ render(); return; }
  const correctPiecePos = g.order.indexOf(wrongPos);
  const tmp = g.order[wrongPos]; g.order[wrongPos] = g.order[correctPiecePos]; g.order[correctPiecePos] = tmp;
  if(g.order.every(function(v,i){ return v===i; })){
    g.done = true;
    finishGame("jigsaw", g.total - Math.min(g.mistakes, g.total), g.total, g.mistakes, g.hints, g.seconds);
  }
  render();
}

function famAdvance(right){
  const g = S.game;
  g.correct += right ? 1 : 0;
  g.mistakes += right ? 0 : 1;
  if(g.idx+1 >= g.cards.length){
    g.done = true;
    finishGame("familiar", g.correct, g.cards.length, g.mistakes, 0, g.seconds);
  } else {
    g.idx++; g.stage = "ask";
  }
  render();
}
function famAnswer(saidFamiliar){
  const g = S.game;
  const card = g.cards[g.idx];
  if(saidFamiliar && card.isFamiliar){ g.stage = "who"; render(); return; }
  famAdvance(saidFamiliar === card.isFamiliar);
}
function famWho(index){
  const g = S.game;
  const card = g.cards[g.idx];
  famAdvance(card.options[index] === card.options[0]);
}

function audioChoose(index){
  const g = S.game;

    g.done = true;
    finishGame("audio", g.correct, g.clips.length, g.mistakes, 0, g.seconds);
  } else {
    g.idx++; g.played = false;
  }
  render();
}

    "</div>"
  );

function routinePick(id){
  const g = S.game;
  if(g.done) return;
  const expected = ROUTINE_STEPS[g.chosen.length];
  const step = g.pool.filter(function(s){ return s.id===id; })[0];
  if(!step || expected.id !== id) g.mistakes++;
  g.chosen.push(step);
  if(g.chosen.length === ROUTINE_STEPS.length){
    g.done = true;
    const correctCount = g.chosen.filter(function(s,i){ return s.id === ROUTINE_STEPS[i].id; }).length;
    finishGame("routine", correctCount, ROUTINE_STEPS.length, g.mistakes, 0, g.seconds);
  }
  render();
}

/* =========================================================
   Router + master render
   ========================================================= */
function applyA11y(){
  const root = document.documentElement;
  root.classList.toggle("large-text", S.a11y.largeText);
  root.classList.toggle("high-contrast", S.a11y.highContrast);
  root.classList.toggle("reduced-motion", S.a11y.reducedAnimation);
  root.classList.toggle("simple-mode", S.a11y.simpleMode);
}

function renderRoute(path, t){
  if(path === "/") return pageLanding(t);
  if(path === "/role") return pageRole(t);
  if(path === "/patient") return pagePatientHome(t);
  if(path === "/patient/today") return pageToday(t);
  if(path === "/patient/progress") return pageProgress(t);
  if(path === "/patient/familiar-world") return pageFamiliarWorld(t);
  if(path === "/patient/results") return pageResult(t);
  if(path === "/settings") return pageSettings(t);
  if(path === "/caregiver") return pageCaregiver(t);
  if(path === "/patient/game/jigsaw") return pageJigsaw(t);
  if(path === "/patient/game/familiar") return pageFamiliar(t);
  if(path === "/patient/game/audio") return pageAudio(t);
  if(path === "/patient/game/routine") return pageRoutine(t);
  return pageLanding(t);
}

function render(){
  applyA11y();
  const t = tFor(S.lang);
  document.getElementById("root").innerHTML = renderRoute(S.route, t);
}

function nav(path){ location.hash = path; }

function onRouteChange(){
  const newPath = location.hash.slice(1) || "/";
  S.route = newPath;
  const m = newPath.match(/^\/patient\/game\/(\w+)$/);
  if(m){ setupGameState(m[1]); } else { S.game = null; }
  render();
}

/* =========================================================
   Timer — ticks once a second while a game is in progress
   ========================================================= */
let timerId = null;
function startTimerLoop(){
  if(timerId) return;
  timerId = setInterval(function(){
    if(S.game && !S.game.done){
      S.game.seconds++;
      render();
    }
  }, 1000);
}

/* =========================================================
   Voice assistance (browser speech synthesis, optional)
   ========================================================= */
function speak(text){
  if(!S.a11y.voiceAssist) return;
  try{
    if("speechSynthesis" in window){
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.92;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

/* =========================================================
   Click delegation — one listener handles every data-action
   ========================================================= */
document.addEventListener("click", function(e){
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;
  const d = el.dataset;

  if(action === "nav"){ nav(d.path); return; }
  if(action === "go-back"){ history.back(); return; }

  if(action === "set-lang"){ S.lang = d.lang; saveLS("smaran_lang", S.lang); render(); return; }

  if(action === "toggle-a11y"){
    S.a11y = Object.assign({}, S.a11y);
    S.a11y[d.key] = !S.a11y[d.key];
    saveLS("smaran_a11y", S.a11y);
    render();
    return;
  }
  if(action === "toggle-offline"){ S.offline = !S.offline; render(); return; }
  if(action === "save-settings"){
    S.settingsSaved = true; render();
    setTimeout(function(){ S.settingsSaved = false; render(); }, 1600);
    return;
  }
  if(action === "fw-tab"){ S.fwTab = d.tab; render(); return; }

  if(action === "jig-tap"){ jigTap(parseInt(d.pos,10)); return; }
  if(action === "jig-hint"){ jigHint(); return; }

  if(action === "fam-answer"){ famAnswer(d.val === "true"); return; }
  if(action === "fam-who"){ famWho(parseInt(d.index,10)); return; }

  if(action === "audio-play"){ audioPlay(); return; }
  if(action === "audio-choose"){ audioChoose(parseInt(d.index,10)); return; }

  if(action === "routine-pick"){ routinePick(d.id); return; }
});

/* =========================================================
   Bootstrap
   ========================================================= */
window.addEventListener("hashchange", onRouteChange);
if(!location.hash) location.hash = "/";
onRouteChange();
startTimerLoop();
</script>
